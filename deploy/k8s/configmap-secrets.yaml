apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
data:
  NODE_ENV: "production"
  PORT: "3001"
  BASE_URL: "https://controle-gastos.caioscatolino.com.br"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: default
type: Opaque
stringData:
  # No Kubernetes real, estes valores são injetados pelo pipeline CI/CD ou Vault
  DATABASE_URL: "mysql://root:root@mysql-service:3306/controle_gastos"
  REDIS_URL: "redis://redis-service:6379"
  JWT_SECRET: "jwt_super_secret_enterprise_token_production"
  RESEND_API_KEY: "sua_chave_resend_aqui"
  GEMINI_API_KEY: "sua_chave_gemini_aqui"
