apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: default
  labels:
    app: controle-gastos-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: controle-gastos-api
  template:
    metadata:
      labels:
        app: controle-gastos-api
    spec:
      containers:
        - name: api
          image: controle-gastos-api:latest # Imagem gerada pelo nosso api.Dockerfile
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          # Importa todas as variáveis do ConfigMap e Secret que criamos
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          # Sonda de Liveness: O Kubernetes checa a saúde da API e do MySQL periodicamente
          livenessProbe:
            httpGet:
              path: /api/ping
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Sonda de Readiness: Só manda tráfego quando a API terminar de subir
          readinessProbe:
            httpGet:
              path: /api/ping
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
          # Limites de consumo para proteger a VPS
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
# Service: O Balanceador de Carga Interno da API
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: controle-gastos-api
  ports:
    - name: http
      port: 3001
      targetPort: 3001
